name: Validate application

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feat/registration-email-queue-clean"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        env:
          VITE_SUPABASE_URL: https://wtwvytwsnffdhijmnosv.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
