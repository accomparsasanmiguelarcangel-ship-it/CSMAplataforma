name: Validate application

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feat/registration-email-queue-clean"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: |
          deno check supabase/functions/send-email-hook/index.ts
          deno check supabase/functions/process-registration-email-queue/index.ts
          deno check supabase/functions/confirm-registration/index.ts
