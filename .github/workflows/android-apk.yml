name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-capacitor

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor for this build
        run: npm install --no-save --package-lock=false @capacitor/core@^9 @capacitor/cli@^9 @capacitor/android@^9

      - name: Build web app for Android
        env:
          VITE_SUPABASE_URL: https://wtwvytwsnffdhijmnosv.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_4PbFWBA5vMzjDBA-FtFBDw_pByUQhiy
        run: npm run build -- --mode android

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Enable camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.CAMERA" />'
          if "android.permission.CAMERA" not in content:
              content = content.replace("<application", permission + "\\n    <application", 1)
          manifest.write_text(content)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comparsa-san-miguel-arcangel-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
